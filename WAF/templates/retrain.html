<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retrain Dashboard</title>
    <style>
        body { font-family: Arial; padding: 30px; text-align: center; }
        h1 { color: #2c3e50; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
        }
        .btn:hover { background: #2980b9; }

        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }

        .log-box { margin-top: 20px; text-align: left; }

        /* Hiệu ứng loading (xoay vòng tròn) */
        .spinner {
            display: none;
            margin: 15px auto 0;
            width: 40px;
            height: 40px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #2ecc71; /* xanh lá */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        form { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <h1>Retrain Dashboard</h1>
    <p>Extracted <strong>{{ payload_count }}</strong> payloads to access_log.txt</p>

    <form id="retrain-form" method="post" action="/retrain/start">
        <button id="retrain-btn" type="submit" class="btn">Start Retrain</button>
        <div class="spinner" id="loading-spinner"></div>
    </form>

    <div class="log-box">
        <h2>Last WAF Logs</h2>
        <table>
            <tr><th>Timestamp</th><th>IP</th><th>Payload</th><th>Detection Type</th><th>Label</th></tr>
            {% for entry in logs %}
            <tr>
                <td>{{ entry.timestamp }}</td>
                <td>{{ entry.ip }}</td>
                <td>{{ entry.payload }}</td>
                <td>{{ entry.detection_type }}</td>
                <td>{{ entry.label }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <p><a href="/">Back to Home Page</a></p>

    <script>
        const form = document.getElementById("retrain-form");
        const btn = document.getElementById("retrain-btn");
        const spinner = document.getElementById("loading-spinner");

        form.addEventListener("submit", function() {
            // Hiển thị spinner và vô hiệu hóa nút
            spinner.style.display = "block";
            btn.disabled = true;
            btn.textContent = "Retraining...";
        });
    </script>
</body>
</html>
